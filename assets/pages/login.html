<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <title>Iniciar sesión — Administración</title>
  <style>
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100dvh; padding: 20px;
      background: var(--ink);
    }
    .login-wrap {
      width: 100%; max-width: 380px;
      animation: fadeInUp .4s var(--ease) both;
    }
    .login-brand {
      text-align: center; margin-bottom: 32px;
    }
    .login-brand .mark {
      width: 52px; height: 52px; border-radius: 14px;
      background: var(--rose); color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.4rem; margin: 0 auto 12px;
    }
    .login-brand h1 {
      font-size: 1.15rem; font-weight: 600; color: #fff; margin-bottom: 4px;
    }
    .login-brand p { font-size: .82rem; color: rgba(255,255,255,.4); }

    .login-card {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 14px; padding: 28px 26px;
    }
    .login-card label {
      display: block; margin-bottom: 6px;
      font-size: .75rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .5px;
      color: rgba(255,255,255,.5);
    }
    .login-card input {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
      color: #fff; border-radius: 8px;
      padding: 10px 13px; margin-bottom: 16px;
    }
    .login-card input::placeholder { color: rgba(255,255,255,.25); }
    .login-card input:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 3px rgba(192,82,122,.2);
      background: rgba(255,255,255,.09);
    }
    .login-card .btn-primary {
      width: 100%; justify-content: center;
      min-height: 44px; font-size: .9rem; font-weight: 600;
      margin-top: 4px;
    }
    #login-error {
      color: #f87171; font-size: .8rem;
      min-height: 1.2em; text-align: center; margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-brand">
      <h1>Comercial Jenk Cáceres</h1>
      <p>Acceso de administración</p>
    </div>

    <form class="login-card" id="form-login">
      <div>
        <label for="login-email">Correo electrónico</label>
        <input type="email" id="login-email" autocomplete="username" placeholder="correo@ejemplo.com" required/>
      </div>
      <div>
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" autocomplete="current-password" placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn btn-primary" id="btn-login">
        <i class="fas fa-right-to-bracket"></i> Entrar
      </button>
      <br>
      <a href="../../index.html" class="btn btn-primary">Volver</a>
      <p id="login-error"></p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/supabase-config.js"></script>
  <script>
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    client.auth.getSession().then(({ data }) => {
      if (data?.session) window.location.href = "administrador.html";
    });

    document.getElementById("form-login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email    = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const boton    = document.getElementById("btn-login");
      const errorEl  = document.getElementById("login-error");

      errorEl.textContent = "";
      boton.disabled = true;
      boton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Entrando…';

      const { error } = await client.auth.signInWithPassword({ email, password });

      if (error) {
        errorEl.textContent = "Correo o contraseña incorrectos.";
        boton.disabled = false;
        boton.innerHTML = '<i class="fas fa-right-to-bracket"></i> Entrar';
        return;
      }

      window.location.href = "administrador.html";
    });
  </script>
</body>
</html>
